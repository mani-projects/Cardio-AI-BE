name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH into VPS and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: "72.167.44.58"
          username: "cardioroot"
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            cd /opt/cardio-ai-server
            git pull
            ./deploy/deploy.sh
