services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cardioai
      POSTGRES_PASSWORD: cardioai
      POSTGRES_DB: cardioai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cardioai -d cardioai"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
