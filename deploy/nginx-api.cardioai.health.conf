# Copy to /etc/nginx/sites-available/api.cardioai.health, symlink into
# sites-enabled, then run: sudo certbot --nginx -d api.cardioai.health
# Certbot rewrites this file to add the 443/SSL block and the 80->443 redirect
# automatically — don't hand-write the SSL block yourself.
server {
    listen 80;
    server_name api.cardioai.health;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
